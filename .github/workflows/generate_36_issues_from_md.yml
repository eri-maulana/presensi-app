name: Generate 36 Issues from MD

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  create_issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Octokit
        run: |
          npm init -y
          npm install @octokit/rest

      - name: Create issues with Node script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node <<'NODEJS'
          const fs = require('fs');
          const { Octokit } = require("@octokit/rest");

          const path = '.github/ISSUE_TEMPLATE/all_steps.md';
          if (!fs.existsSync(path)) {
            console.error(`ERROR: file not found: ${path}`);
            process.exit(1);
          }

          const token = process.env.GITHUB_TOKEN;
          if (!token) {
            console.error('ERROR: GITHUB_TOKEN not found');
            process.exit(1);
          }

          const octokit = new Octokit({ auth: token });
          const [owner, repo] = process.env.REPO.split('/');

          const content = fs.readFileSync(path, 'utf8');
          const raw = content.split(/\n(?=# )/g).map(s => s.trim()).filter(Boolean);

          function parseSection(sec) {
            sec = sec.replace(/^\s+/, '');
            if (!sec.startsWith('# ')) sec = '# ' + sec;
            const firstLineEnd = sec.indexOf('\n');
            let title = firstLineEnd === -1
              ? sec.replace(/^#\s*/, '').trim()
              : sec.slice(0, firstLineEnd).replace(/^#\s*/, '').trim();
            let body = firstLineEnd === -1 ? '' : sec.slice(firstLineEnd + 1).trim();
            if (!body) body = '_No description provided._';
            return { title, body };
          }

          (async () => {
            const existing = [];
            for await (const res of octokit.paginate.iterator(octokit.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            })) {
              for (const it of res.data) existing.push(it.title);
            }

            for (const sec of raw) {
              const { title, body } = parseSection(sec);
              if (existing.includes(title)) {
                console.log(`Skipping existing issue: ${title}`);
                continue;
              }
              try {
                const res = await octokit.issues.create({
                  owner,
                  repo,
                  title,
                  body: body + '\n\n*Automatically generated by workflow.*',
                  labels: ['step']
                });
                console.log(`✅ Created: ${title} -> #${res.data.number}`);
                await new Promise(r => setTimeout(r, 300));
              } catch (err) {
                console.error(`❌ Failed
